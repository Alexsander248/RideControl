<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carregando...</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <div class="splash-ambient splash-ambient-a" aria-hidden="true"></div>
    <div class="splash-ambient splash-ambient-b" aria-hidden="true"></div>
    <div class="splash-container">
      <div class="logo-shell" aria-hidden="true">
        <img src="icons/icon.png" class="logo" alt="Ride Control" />
      </div>
      <h1 class="title">Ride Control</h1>
      <p class="subtitle">Preparando sua garagem e verificando atualizações</p>
      <div class="status-row" aria-live="polite">
        <span class="status-dot"></span>
        <span id="splash-status" class="status-text">Iniciando aplicativo</span>
      </div>
      <div class="progress-shell" aria-hidden="true">
        <div class="progress-track">
          <div id="splash-progress" class="progress-fill"></div>
        </div>
        <span class="progress-label">Carregando experiência premium</span>
      </div>
    </div>
    <script src="splash.js"></script>
  </body>
</html>
