<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22C55E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="RideControl" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon.png" />
    <link rel="stylesheet" href="/splash.css" />
    <title>RideControl</title>
  </head>
  <body>
    <div id="app-splash" class="app-splash" aria-hidden="true">
      <div class="splash-ambient splash-ambient-a" aria-hidden="true"></div>
      <div class="splash-ambient splash-ambient-b" aria-hidden="true"></div>
      <div class="splash-container">
        <div class="logo-shell" aria-hidden="true">
          <img src="/icons/icon.png" class="logo" alt="Ride Control" />
        </div>
        <h1 class="title">Ride Control</h1>
        <p class="subtitle">
          Preparando sua garagem e verificando atualizações
        </p>
        <div class="status-row" aria-live="polite">
          <span class="status-dot"></span>
          <span id="splash-status" class="status-text"
            >Iniciando aplicativo</span
          >
        </div>
        <div class="progress-shell" aria-hidden="true">
          <div class="progress-track">
            <div id="splash-progress" class="progress-fill"></div>
          </div>
          <span class="progress-label">Carregando...</span>
        </div>
        <div id="splash-complete" class="complete-row" aria-live="polite">
          <span class="check-badge" aria-hidden="true">
            <svg class="check-svg" viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5L10 17L19 8" />
            </svg>
          </span>
          <span class="complete-text">Carregamento concluído</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/splash.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
